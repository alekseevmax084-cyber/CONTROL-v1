<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141b"><link rel="manifest" href="manifest.json"><title>CONTROL</title><style>body{margin:0;background:#10141b;color:#f5f6fa;font:15px system-ui}main{max-width:580px;margin:auto;padding:22px 16px 100px}h1{letter-spacing:3px}h2{font-size:20px}.card{background:#1c2430;border:1px solid #303b4b;border-radius:18px;padding:16px;margin:12px 0}.muted,small{color:#aab4c4}.big{font-size:32px;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}input,select,button{font:inherit;border-radius:10px;padding:11px}input,select{background:#121923;color:white;border:1px solid #455267;width:100%;box-sizing:border-box;margin:6px 0 12px}label{font-size:13px;color:#c4cddd}button{background:#a5edbd;border:0;font-weight:700;color:#10141b}button.alt{background:#394354;color:white}.nav{position:fixed;bottom:0;left:0;right:0;background:#1b222d;padding:10px 5px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav div{max-width:580px;width:100%;display:flex}.nav button{flex:1;background:transparent;color:#bbc5d5;font-size:11px;padding:10px 2px}.nav .active{background:#314437;color:#b5f9ca}.hide{display:none}.line{border-top:1px solid #3a4350;padding:12px 0}.good{color:#a5edbd}.bad{color:#ffa6a6}.warn{color:#ffd48c}.bar{background:#3c4552;border-radius:8px;height:9px;overflow:hidden}.bar span{display:block;background:#a5edbd;height:100%}</style><main><header class="row"><div><h1>CONTROL</h1><small>Твоя система независимости</small></div><span id="date"></span></header><section id="home"></section><section id="money" class="hide"></section><section id="buy" class="hide"></section><section id="goals" class="hide"></section><section id="stats" class="hide"></section></main><nav class="nav"><div id="nav"></div></nav><script>
const $=s=>document.querySelector(s),today=()=>new Date().toLocaleDateString('sv-SE'),plus=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')},fmt=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n||0),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>{let x=Number(v);return Number.isFinite(x)&&x>=0?x:null};let db,S,tab='home';const blank=()=>({balance:0,essentials:0,reserve:0,months:3,profit:0,ready:false,transactions:[],events:[],tasks:[]});function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()};async function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('control_v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}async function load(){return new Promise(ok=>{let r=db.transaction('data').objectStore('data').get('main');r.onsuccess=()=>ok(r.result)})}async function persist(){return new Promise(ok=>{let t=db.transaction('data','readwrite');t.objectStore('data').put(S,'main');t.oncomplete=ok})}async function change(f){f();await persist();draw()};function balance(){return S.balance+S.transactions.reduce((a,t)=>a+(t.kind==='in'?t.sum:-t.sum),0)}function nextDay(day,from){let d=new Date(from+'T12:00:00'),k=new Date(d.getFullYear(),d.getMonth(),Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()),12);if(k<d)k=new Date(d.getFullYear(),d.getMonth()+1,Math.min(day,new Date(d.getFullYear(),d.getMonth()+2,0).getDate()),12);return k.toLocaleDateString('sv-SE')};function forecast(days,purchase=0,when=today()){let end=plus(today(),days),ev=[];for(let e of S.events){if(e.kind==='in'&&!e.confirmed)continue;if(e.repeat){let d=nextDay(e.day,today());while(d<=end){ev.push({...e,date:d});d=nextDay(e.day,plus(d,1))}}else if(e.date>=today()&&e.date<=end)ev.push(e)}if(purchase)ev.push({date:when,kind:'out',sum:purchase});let bal=balance(),min=bal,minDay=today();for(let i=0;i<=days;i++){let date=plus(today(),i);if(i)bal-=S.essentials/30.44;for(let e of ev)if(e.date===date)bal+=(e.kind==='in'?e.sum:-e.sum);if(bal<min){min=bal;minDay=date}}return {bal,min,minDay}}function input(label,name,value='',type='number',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${safe(value)}" ${extra}></label>`}function nav(t){tab=t;draw();scrollTo(0,0)}function draw(){let b=balance(),f=forecast(30);$('#date').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'});$('#nav').innerHTML=[['home','Сегодня'],['money','Деньги'],['buy','Покупка'],['goals','Цели'],['stats','Аналитика']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="nav('${k}')">${v}</button>`).join('');for(let k of ['home','money','buy','goals','stats'])$('#'+k).classList.toggle('hide',tab!==k);
$('#home').innerHTML=`<h2>Сегодня</h2>${!S.ready?'<div class="card"><h3>Начни с настройки</h3><p class="muted">Внеси баланс и расходы в разделе «Деньги».</p><button onclick="nav(\'money\')">Настроить</button></div>':''}<div class="card"><small>Доступно на счетах</small><div class="big">${fmt(b)}</div><div class="row"><small>Защищённый остаток</small><b>${fmt(S.reserve)}</b></div><div class="row"><small>Прогнозный минимум за 30 дней</small><b class="${f.min<S.reserve?'warn':'good'}">${fmt(f.min)}</b></div></div><div class="grid"><div class="card"><small>Расходы на жизнь / месяц</small><h3>${fmt(S.essentials)}</h3></div><div class="card"><small>Резерв / расходы</small><h3>${S.essentials?(S.reserve/S.essentials).toFixed(1):'—'} мес.</h3></div></div><div class="card"><div class="row"><h3>Задачи дня</h3><button onclick="addTask()">+</button></div>${S.tasks.filter(x=>x.date===today()).map(x=>`<div class="line"><label><input style="width:auto" type="checkbox" ${x.done?'checked':''} onchange="toggleTask('${x.id}')"> ${safe(x.text)}</label></div>`).join('')||'<p class="muted">Добавь действие для продаж, финансов или здоровья.</p>'}</div><div class="card"><h3>Проверка покупки</h3><p class="muted">Узнай, не создаст ли покупка риск для обязательных платежей.</p><button onclick="nav('buy')">Проверить</button></div>`;
$('#money').innerHTML=`<h2>Деньги</h2><div class="card"><h3>Стартовые параметры</h3><form id="settings">${input('Стартовый баланс, ₽','balance',S.balance,'number','step="0.01" required')}${input('Базовые расходы в месяц, ₽','essentials',S.essentials,'number','step="0.01" required')}${input('Защищённый остаток, ₽','reserve',S.reserve,'number','step="0.01" required')}<p class="muted">В базовые расходы не включай платежи, которые внесёшь отдельно, иначе прогноз посчитает их дважды.</p><button>Сохранить</button></form></div><div class="card"><h3>Новая операция</h3><form id="tx"><label>Тип<select name="kind"><option value="out">Расход</option><option value="in">Доход</option></select></label>${input('Сумма, ₽','sum','','number','min="0.01" step="0.01" required')}${input('Описание','name','','text','required')}<button>Записать</button></form></div><div class="card"><h3>Будущие платежи и поступления</h3><form id="ev"><label>Тип<select name="kind"><option value="out">Платёж</option><option value="in">Поступление</option></select></label>${input('Название','name','','text','required')}${input('Сумма, ₽','sum','','number','min="0.01" step="0.01" required')}${input('Дата','date',today(),'date','required')}<label>Периодичность<select name="repeat"><option value="yes">Каждый месяц</option><option value="no">Один раз</option></select></label><label><input type="checkbox" name="confirmed" style="width:auto"> Поступление подтверждено</label><button>Добавить</button></form>${S.events.map(x=>`<div class="line row"><div><b>${safe(x.name)}</b><br><small>${fmt(x.sum)} · ${x.repeat?'каждый месяц, '+x.day+' числа':x.date}${x.kind==='in'&&!x.confirmed?' · не гарантировано':''}</small></div><button class="alt" onclick="remove('events','${x.id}')">×</button></div>`).join('')}</div><div class="card"><h3>Операции</h3>${S.transactions.slice().reverse().map(x=>`<div class="line row"><span>${safe(x.name)}</span><span>${x.kind==='in'?'+':'−'}${fmt(x.sum)} <button class="alt" onclick="remove('transactions','${x.id}')">×</button></span></div>`).join('')||'<p class="muted">Пока пусто</p>'}</div>`;
$('#buy').innerHTML=`<h2>Умная проверка покупки</h2><div class="card"><form id="purchase">${input('Что хочешь купить','name','','text','required')}${input('Стоимость, ₽','sum','','number','min="0.01" step="0.01" required')}${input('Дата покупки','date',today(),'date','required')}<button>Проанализировать</button></form><div id="result"></div></div><p class="muted">Проверка использует только введённые данные, равномерное распределение базовых расходов и подтверждённые доходы. Неучтённые платежи и задержки доходов могут изменить результат.</p>`;
let target=S.essentials*S.months;$('#goals').innerHTML=`<h2>Финансовая независимость</h2><div class="card"><h3>Цель резерва</h3><div class="big">${fmt(S.reserve)} <small>/ ${fmt(target)}</small></div><div class="bar"><span style="width:${target?Math.min(100,S.reserve/target*100):0}%"></span></div><form id="goal">${input('Цель резерва, месяцев','months',S.months,'number','min="1" max="24" required')}${input('Прибыль своего бизнеса в месяц, ₽','profit',S.profit,'number','min="0" step="0.01" required')}<button>Сохранить</button></form></div><div class="card"><h3>Покрытие расходов бизнесом</h3><div class="big">${S.essentials?Math.round(S.profit/S.essentials*100):0}%</div><p class="muted">Прибыль указана вручную. Не принимай решение об уходе из найма без нескольких месяцев устойчивых результатов и резерва.</p></div>`;
$('#stats').innerHTML=`<h2>Аналитика</h2><div class="grid"><div class="card"><small>Записанные доходы</small><h3>${fmt(S.transactions.filter(x=>x.kind==='in').reduce((a,x)=>a+x.sum,0))}</h3></div><div class="card"><small>Записанные расходы</small><h3>${fmt(S.transactions.filter(x=>x.kind==='out').reduce((a,x)=>a+x.sum,0))}</h3></div></div><div class="card"><h3>Прогноз остатков</h3>${[7,30,90].map(d=>`<div class="line row"><span>Через ${d} дней</span><b>${fmt(forecast(d).bal)}</b></div>`).join('')}</div><div class="card"><h3>Резервное копирование</h3><p class="muted">Данные хранятся только на этом устройстве. Сохраняй резервную копию регулярно.</p><button onclick="backup()">Скачать JSON</button><label>Восстановить<input id="restore" type="file" accept=".json,application/json"></label><button class="alt" onclick="resetAll()">Удалить всё</button></div>`;wire()}
function wire(){let f=$('#settings');if(f)f.onsubmit=async e=>{e.preventDefault();let v=new FormData(f),a=['balance','essentials','reserve'].map(k=>num(v.get(k)));if(a.includes(null))return alert('Проверь суммы');await change(()=>{S.balance=a[0];S.essentials=a[1];S.reserve=a[2];S.ready=true})};f=$('#tx');if(f)f.onsubmit=async e=>{e.preventDefault();let v=new FormData(f),n=num(v.get('sum'));if(!n)return;await change(()=>S.transactions.push({id:uid(),kind:v.get('kind'),sum:n,name:v.get('name'),date:today()}))};f=$('#ev');if(f)f.onsubmit=async e=>{e.preventDefault();let v=new FormData(f),n=num(v.get('sum'));if(!n)return;await change(()=>S.events.push({id:uid(),kind:v.get('kind'),sum:n,name:v.get('name'),date:v.get('date'),day:Number(v.get('date').slice(8)),repeat:v.get('repeat')==='yes',confirmed:v.get('confirmed')==='on'}))};f=$('#goal');if(f)f.onsubmit=async e=>{e.preventDefault();let v=new FormData(f);await change(()=>{S.months=Math.max(1,Math.min(24,Number(v.get('months'))||3));S.profit=num(v.get('profit'))||0})};f=$('#purchase');if(f)f.onsubmit=e=>{e.preventDefault();let v=new FormData(f),n=num(v.get('sum')),date=v.get('date');if(!n||date<today())return alert('Проверь сумму и дату');let days=Math.min(365,Math.max(30,Math.ceil((new Date(date)-new Date(today()))/86400000)+30)),before=forecast(days),after=forecast(days,n,date),kind=!S.ready||!S.essentials?'warn':after.min<0?'bad':after.min<S.reserve?'warn':'good',title=!S.ready||!S.essentials?'Недостаточно данных':after.min<0?'Высокий риск':after.min<S.reserve?'Угроза резерву':'Укладывается в прогноз';$('#result').innerHTML=`<div class="card"><h3 class="${kind}">${title}</h3><p>Минимальный остаток после покупки: <b>${fmt(after.min)}</b> (${after.minDay}).</p><p>Без покупки: ${fmt(before.min)}. Защищённый порог: ${fmt(S.reserve)}.</p><p class="muted">Это расчётный сценарий, а не гарантия безопасности.</p></div>`};let r=$('#restore');if(r)r.onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.transactions)||!Array.isArray(x.events)||!Array.isArray(x.tasks)||typeof x.balance!=='number')throw Error('Неверный файл');if(confirm('Заменить текущие данные?')){S={...blank(),...x};await persist();draw()}}catch(err){alert('Ошибка импорта: '+err.message)}}}
async function addTask(){let t=prompt('Задача на сегодня');if(t?.trim())await change(()=>S.tasks.push({id:uid(),date:today(),text:t.trim(),done:false}))}async function toggleTask(id){await change(()=>{let t=S.tasks.find(x=>x.id===id);if(t)t.done=!t.done})}async function remove(key,id){if(confirm('Удалить запись?'))await change(()=>S[key]=S[key].filter(x=>x.id!==id))}function backup(){let url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='control-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function resetAll(){if(confirm('Удалить все локальные данные?'))await change(()=>S=blank())}(async()=>{try{await openDB();S=await load()||blank();draw();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){document.querySelector('main').innerHTML='<h2>Не удалось открыть хранилище</h2><p>Используй Safari без приватного режима на HTTPS-сайте.</p>'}})();
</script></html>
