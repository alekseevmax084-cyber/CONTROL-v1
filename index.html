<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a0d14"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon.png"><title>CONTROL 3.1</title><style>
:root{color-scheme:dark;--bg:#090c13;--panel:#151b27;--panel2:#1b2332;--line:#303a4b;--fg:#f5f7ff;--muted:#98a4b8;--mint:#a2f5c5;--orange:#ffcc8b;--red:#ff9d9d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#263d45 0,transparent 48%),var(--bg);color:var(--fg);font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;min-height:100vh}main{max-width:660px;margin:auto;padding:28px 17px 112px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}header b{font-size:23px;letter-spacing:3px}header small{display:block;color:var(--muted);margin-top:4px}h1{font-size:28px;line-height:1.15;margin:0 0 18px;letter-spacing:-.6px}h2{font-size:17px;margin:0 0 14px}p{line-height:1.55}small,.muted{color:var(--muted)}.card{border:1px solid var(--line);border-radius:22px;padding:19px;background:linear-gradient(155deg,#1a2230,#111722);margin:13px 0;box-shadow:0 12px 35px #0002;animation:rise .3s ease both}.hero{background:linear-gradient(145deg,#23443f,#1b2735 65%,#141b27)}.amount{font-size:34px;font-weight:800;letter-spacing:-1.4px;margin:9px 0 15px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid .card{margin:0}.stat{font-size:21px;font-weight:800;margin-top:9px;overflow-wrap:anywhere}.caption{font-size:12px;color:var(--muted)}.pill{border:1px solid #3c5260;background:#243240;padding:7px 11px;border-radius:999px;font-size:12px}.good{color:var(--mint)}.warn{color:var(--orange)}.bad{color:var(--red)}.progress{height:9px;background:#343d4a;border-radius:9px;overflow:hidden;margin:13px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#7be7bd,#c7ffcf);border-radius:9px;transition:width .45s}.nav{position:fixed;bottom:0;left:0;right:0;background:#101722ee;backdrop-filter:blur(20px);border-top:1px solid #303a4b;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:10}.nav>div{max-width:660px;margin:auto;display:flex;justify-content:space-between}.nav button{border:0;background:transparent;color:#9ca9bd;flex:1;font-size:11px;padding:9px 2px;border-radius:13px;font-weight:650}.nav button.active{color:#102319;background:var(--mint)}button{background:var(--mint);color:#0e2218;border:0;border-radius:13px;padding:13px 17px;font-weight:750;font:inherit;cursor:pointer;transition:transform .16s,filter .16s}button:active{transform:scale(.96)}button.ghost{background:#303a4b;color:white}button.del{background:#402b35;color:#ffd1d1;padding:8px 12px}button.full{width:100%}input,select,textarea{width:100%;border:1px solid #405068;background:#0d1420;color:white;border-radius:13px;padding:13px 14px;font:inherit;margin:7px 0 14px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px #a2f5c51c}label{display:block;font-size:13px;color:#c1cbda;margin-top:5px}input[type=checkbox]{width:23px;height:23px;margin:0;accent-color:#a2f5c5;flex-shrink:0}.entry{border-top:1px solid #303a4b;padding:12px 0}.entry:first-child{border:0}.task{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #303a4b}.task span{flex:1}.task.done span{text-decoration:line-through;color:#8491a4}.section{display:none}.section.active{display:block;animation:rise .24s ease}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#a2f5c5;color:#11271d;padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 12px 35px #0008;z-index:20;max-width:90%;text-align:center}.error{background:#ffb4b4;color:#38141a}.note{font-size:12px;color:#a6b2c5;line-height:1.55}.empty{padding:15px;color:var(--muted);border:1px dashed #3d4759;border-radius:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}details{margin:14px 0}summary{cursor:pointer}summary::marker{color:var(--mint)}@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* CONTROL 3 visual layer */
:root{--mint:#a7f7cb;--gold:#ffcc75;--hot:#ff6e86}
body{background:radial-gradient(ellipse 85% 38% at 50% -8%,#263f42 0,transparent 70%),#080b12}
.card{border-color:#303b49;box-shadow:0 14px 45px #0004}
.hero{background:linear-gradient(135deg,#23453e,#182d33 54%,#151a2a);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-45px;top:-85px;width:190px;height:190px;border-radius:50%;border:30px solid #b4ffcd0b}
.hero>*{position:relative}
.section-title{font-size:12px;font-weight:800;letter-spacing:1.7px;color:#9fb2c0;text-transform:uppercase;margin:23px 0 10px}
.dash-ring{--pct:0;--ring:#a7f7cb;width:176px;height:176px;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--pct)*1%),#35414e 0);padding:13px;box-shadow:0 0 25px color-mix(in srgb,var(--ring) 24%,transparent),inset 0 0 24px #0007;transition:background .5s;flex-shrink:0}
.dash-ring .inner{width:100%;height:100%;background:#141c27;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.ring-title{font-size:13px;font-weight:850;letter-spacing:.4px}
.ring-value{font-size:27px;font-weight:850;margin:4px 0}
.ring-wrap{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;padding:6px 0}
.ring-side{flex:1;min-width:125px}
.ring-side p{margin:7px 0;font-size:13px;color:#b7c4d0}
.budget-line{padding:14px 0;border-top:1px solid #354050}
.budget-line:first-child{border-top:0}
.bar{height:9px;border-radius:10px;background:#303a49;overflow:hidden;margin:10px 0 4px}
.bar>span{height:100%;display:block;border-radius:10px;background:linear-gradient(90deg,#6eddb2,#b6ffd3);transition:width .5s}
.bar.orange>span{background:linear-gradient(90deg,#ffaf70,#ffdc91)}
.bar.red>span{background:linear-gradient(90deg,#ff657a,#ffacb6)}
.micro{font-size:12px;color:#9caabc}
.kpi{font-size:24px;font-weight:850;margin:7px 0}
.signal{padding:11px 13px;border:1px solid #5b4a37;border-radius:12px;background:#4a39242a;color:#ffdbab;font-size:13px;line-height:1.5}
.signal.critical{border-color:#834052;background:#4c1c302f;color:#ffc1ca}
.signal.ok{border-color:#346a56;background:#18433344;color:#c3ffdb}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 12px #ff657a22}50%{box-shadow:0 0 34px #ff657a77}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style></head><body><main><header><div><b>CONTROL<span class="good">.</span></b><small>Система личной независимости</small></div><span class="pill" id="todayDate"></span></header><div id="today" class="section"></div><div id="money" class="section"></div><div id="check" class="section"></div><div id="goals" class="section"></div><div id="insights" class="section"></div></main><nav class="nav"><div id="navItems"></div></nav><div id="toast" role="status" aria-live="polite" hidden></div><script>
'use strict';
const KEY='control_v2_2026',OLD='control-local-v1';
const $=s=>document.querySelector(s), fmt=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n||0), safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])), dateToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}, nextDate=(s,days)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+days);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}, readable=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}), id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()), money=s=>{const n=Number(s);return Number.isFinite(n)&&n>=0?Math.round(n*100)/100:null};
const fresh=()=>({version:2,opening:0,essential:0,protected:0,configured:false,transactions:[],events:[],tasks:[],goals:[],businessProfit:0,goalMonths:3});
let data=fresh(),tab='today',storageOK=true;
function notify(msg,bad=false){const e=$('#toast');e.textContent=msg;e.className='toast'+(bad?' error':'');e.hidden=false;clearTimeout(notify.t);notify.t=setTimeout(()=>e.hidden=true,2800)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));const v=localStorage.getItem(KEY);if(!v||JSON.parse(v).version!==2)throw Error('Запись не подтверждена');storageOK=true;return true}catch(e){storageOK=false;notify('Ошибка сохранения: '+e.message,true);return false}}
function load(){try{let s=localStorage.getItem(KEY);if(s){let x=JSON.parse(s);if(!x||x.version!==2||!Array.isArray(x.transactions)||!Array.isArray(x.events)||!Array.isArray(x.tasks)||!Array.isArray(x.goals))throw Error('Неверный формат данных');data={...fresh(),...x}}}catch(e){notify('Не удалось прочитать данные: '+e.message,true)}}
function change(fn,msg='Сохранено'){let old=structuredClone(data);try{fn();if(!persist()){data=old;return}render();notify(msg)}catch(e){data=old;notify(e.message,true)}}
function current(){return data.opening+data.transactions.reduce((sum,t)=>sum+(t.kind==='income'?t.amount:-t.amount),0)}
function monthOccurrence(day,from){let d=new Date(from+'T12:00:00'),year=d.getFullYear(),month=d.getMonth();for(let i=0;i<15;i++){let y=year+Math.floor((month+i)/12),m=(month+i)%12,last=new Date(y,m+1,0).getDate(),candidate=[y,String(m+1).padStart(2,'0'),String(Math.min(day,last)).padStart(2,'0')].join('-');if(candidate>=from)return candidate}return from}
function projected(days,purchase=0,purchaseDate=dateToday()){let start=dateToday(),end=nextDate(start,days),events=[];for(const e of data.events){if(e.recurring){let d=monthOccurrence(e.day,start);while(d<=end){events.push({...e,date:d});d=monthOccurrence(e.day,nextDate(d,1))}}else if(e.date>=start&&e.date<=end)events.push(e)}if(purchase>0)events.push({kind:'expense',amount:purchase,date:purchaseDate,confirmed:true,name:'Планируемая покупка'});let byDate={};for(let e of events){if(e.kind==='income'&&!e.confirmed)continue;(byDate[e.date]??=[]).push(e)}let balance=current(),minimum=balance,minDate=start;for(let i=0;i<=days;i++){let d=nextDate(start,i);if(i>0)balance-=data.essential/30.44;for(let e of byDate[d]||[])balance+=e.kind==='income'?e.amount:-e.amount;if(balance<minimum){minimum=balance;minDate=d}}return {balance,minimum,minDate}}
function analyse(amount,when){let days=Math.max(30,Math.ceil((new Date(when+'T12:00:00')-new Date(dateToday()+'T12:00:00'))/86400000)+30);days=Math.min(365,days);let before=projected(days),after=projected(days,amount,when);if(!data.configured||data.essential<=0)return {level:'warn',heading:'Недостаточно данных',reason:'Сначала укажи баланс и базовые расходы. Без них нельзя оценить покупку.',before,after};if(after.minimum<0)return {level:'bad',heading:'Высокий риск',reason:`Минимальный остаток ${fmt(after.minimum)} на ${readable(after.minDate)}. Денег может не хватить на обязательства.`,before,after};if(after.minimum<data.protected)return {level:'warn',heading:'Риск для защищённого остатка',reason:`Минимальный остаток ${fmt(after.minimum)} на ${readable(after.minDate)}, ниже установленной границы ${fmt(data.protected)}.`,before,after};return {level:'good',heading:'По введённым данным допустимо',reason:`Минимальный остаток ${fmt(after.minimum)} на ${readable(after.minDate)}. Защищённый остаток ${fmt(data.protected)} не затронут.`,before,after}}
const num=(name,label,val='',more='')=>`<label>${label}<input name="${name}" type="number" inputmode="decimal" min="0" step="0.01" value="${safe(val)}" ${more}></label>`, txt=(name,label,val='',more='')=>`<label>${label}<input name="${name}" type="text" value="${safe(val)}" ${more}></label>`, date=(name,label,val=dateToday())=>`<label>${label}<input name="${name}" type="date" value="${safe(val)}" required></label>`;
function render(){const balance=current(),p30=projected(30),ratio=data.essential>0?data.protected/data.essential:0;$('#todayDate').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'});$('#navItems').innerHTML=[['today','Сегодня'],['money','Деньги'],['check','Покупка'],['goals','Цели'],['insights','Аналитика']].map(([k,v])=>`<button type="button" data-nav="${k}" class="${tab===k?'active':''}">${v}</button>`).join('');for(let k of ['today','money','check','goals','insights'])$('#'+k).classList.toggle('active',k===tab);
$('#today').innerHTML=`<h1>Твоя точка опоры</h1>${!data.configured?'<div class="card"><h2>Начни с настройки</h2><p class="muted">Добавь стартовый баланс и базовые расходы. Всё сохраняется на этом телефоне.</p><button data-nav="money">Настроить финансы</button></div>':''}<div class="card hero"><small>Деньги сейчас</small><div class="amount">${fmt(balance)}</div><div class="row"><span class="muted">Защищённый остаток</span><b>${fmt(data.protected)}</b></div><div class="row" style="margin-top:10px"><span class="muted">Минимум в ближайшие 30 дней</span><b class="${p30.minimum<data.protected?'warn':'good'}">${fmt(p30.minimum)}</b></div></div><div class="grid"><div class="card"><small>Базовые расходы/мес.</small><div class="stat">${fmt(data.essential)}</div></div><div class="card"><small>Защита в месяцах</small><div class="stat">${ratio.toFixed(1)}</div></div></div><div class="card"><div class="row"><h2>План на сегодня</h2><button class="ghost" data-action="task-add">+ Задача</button></div>${data.tasks.filter(t=>t.date===dateToday()).map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><span>${safe(t.title)}</span><button class="del" data-task-del="${t.id}">×</button></div>`).join('')||'<div class="empty">Добавь одну задачу для бизнеса и одну для себя.</div>'}</div><div class="card"><h2>Перед покупкой</h2><p class="muted">Проверь, не ударит ли трата по обязательным платежам и финансовой безопасности.</p><button data-nav="check">Проверить трату →</button></div>`;
$('#money').innerHTML=`<h1>Деньги</h1><div class="card"><h2>Финансовая база</h2><form id="baseForm">${num('opening','Стартовый баланс, ₽',data.opening,'required')}${num('essential','Базовые расходы за месяц, ₽',data.essential,'required')}${num('protected','Защищённый остаток, ₽',data.protected,'required')}<p class="note">Защищённый остаток — сумма, ниже которой ты не хочешь опускаться. Её можно менять в любой момент. Стартовый баланс — исходная сумма, операции учитываются отдельно.</p><button class="full" type="submit">Сохранить изменения</button></form></div><div class="card"><h2>Новая операция</h2><form id="transactionForm"><label>Тип<select name="kind"><option value="expense">Расход</option><option value="income">Доход</option></select></label>${num('amount','Сумма, ₽','','required min="0.01"')}${txt('name','На что / откуда','','required')}${date('date','Дата')}<button class="full" type="submit">Записать операцию</button></form></div><div class="card"><h2>Будущие платежи и доходы</h2><form id="eventForm"><label>Тип<select name="kind"><option value="expense">Обязательный платёж</option><option value="income">Ожидаемое поступление</option></select></label>${txt('name','Название','','required')}${num('amount','Сумма, ₽','','required min="0.01"')}${date('date','Дата / число первого платежа')}<label>Повторение<select name="recurring"><option value="yes">Каждый месяц</option><option value="no">Один раз</option></select></label><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" name="confirmed"> Поступление подтверждено</label><p class="note">Неподтверждённые доходы не включаются в безопасный прогноз. Не учитывай один расход одновременно в базовых расходах и в будущих платежах.</p><button class="full" type="submit">Добавить в прогноз</button></form>${data.events.map(e=>`<div class="entry row"><div><b>${safe(e.name)}</b><div class="caption">${e.kind==='income'?'Доход':'Платёж'} · ${fmt(e.amount)} · ${e.recurring?e.day+' числа ежемесячно':readable(e.date)}${e.kind==='income'&&!e.confirmed?' · не подтверждён':''}</div></div><button class="del" data-event-del="${e.id}">×</button></div>`).join('')}</div><div class="card"><h2>История операций</h2>${data.transactions.slice().reverse().slice(0,60).map(t=>`<div class="entry row"><div>${safe(t.name)}<div class="caption">${readable(t.date)}</div></div><div class="row"><b class="${t.kind==='income'?'good':''}">${t.kind==='income'?'+':'−'}${fmt(t.amount)}</b><button class="del" data-tx-del="${t.id}">×</button></div></div>`).join('')||'<div class="empty">Операций пока нет</div>'}</div>`;
$('#check').innerHTML=`<h1>Можно ли потратить?</h1><div class="card"><h2>Проверка решения</h2><form id="purchaseForm">${txt('name','Что хочешь купить?','','required')}${num('amount','Стоимость, ₽','','required min="0.01"')}${date('date','Дата покупки')}<button class="full" type="submit">Проанализировать</button></form><div id="purchaseResult"></div></div><div class="card"><h2>Как система решает</h2><p class="note">Считает будущие остатки по дням с учётом базовых расходов, известных платежей и только подтверждённых доходов. Если покупка создаёт кассовый разрыв или снижает остаток ниже твоего порога — предупреждает. Это расчёт, а не гарантия.</p></div>`;
$('#goals').innerHTML=`<h1>Цели и рост</h1><div class="card"><h2>Мой резерв</h2><div class="amount">${fmt(data.protected)}</div><p class="muted">Цель — ${data.goalMonths} мес. базовых расходов: ${fmt(data.goalMonths*data.essential)}</p><div class="progress"><span style="width:${data.essential?Math.min(100,100*data.protected/(data.goalMonths*data.essential)):0}%"></span></div><form id="independenceForm">${num('months','Размер подушки в месяцах',data.goalMonths,'required min="1" max="36" step="1"')}${num('profit','Чистая прибыль бизнеса за месяц, ₽',data.businessProfit,'required')}<button class="full" type="submit">Обновить параметры</button></form><p class="note">Защищённый остаток редактируется во вкладке «Деньги». Это целевой порог, а не отдельный банковский счёт.</p></div><div class="card"><h2>Мои финансовые цели</h2><form id="goalForm">${txt('title','Название цели (например, резерв 200 000 ₽)','','required')}${num('target','Сколько нужно, ₽','','required min="0.01"')}${num('saved','Уже накоплено, ₽','0','required')}<button class="full" type="submit">Создать цель</button></form>${data.goals.map(g=>`<div class="entry"><div class="row"><b>${safe(g.title)}</b><button class="del" data-goal-del="${g.id}">×</button></div><p class="muted">${fmt(g.saved)} из ${fmt(g.target)}</p><div class="progress"><span style="width:${Math.min(100,100*g.saved/g.target)}%"></span></div><form data-goal-update="${g.id}"><label>Накоплено сейчас, ₽<input type="number" name="saved" min="0" step="0.01" value="${g.saved}" required></label><button class="ghost" type="submit">Обновить сумму</button></form></div>`).join('')}</div><div class="card"><h2>Выход из найма</h2><p>Прибыль бизнеса: <b>${fmt(data.businessProfit)}/мес.</b></p><p>Покрытие базовых расходов: <b>${data.essential?Math.round(data.businessProfit/data.essential*100):0}%</b></p><p class="note">Прибыль вводится вручную. Для решения об увольнении оцени стабильность прибыли за несколько месяцев и размер резерва.</p></div>`;
$('#insights').innerHTML=`<h1>Аналитика</h1><div class="grid"><div class="card"><small>Доходы по операциям</small><div class="stat good">${fmt(data.transactions.filter(t=>t.kind==='income').reduce((a,t)=>a+t.amount,0))}</div></div><div class="card"><small>Расходы по операциям</small><div class="stat">${fmt(data.transactions.filter(t=>t.kind==='expense').reduce((a,t)=>a+t.amount,0))}</div></div></div><div class="card"><h2>Прогноз остатков</h2>${[7,30,90].map(d=>{let f=projected(d);return `<div class="entry row"><span>Через ${d} дней</span><b class="${f.minimum<0?'bad':''}">${fmt(f.balance)}</b></div>`}).join('')}<p class="note">Прогноз включает равномерные базовые расходы и внесённые будущие операции. Он не учитывает непредвиденные расходы.</p></div><div class="card"><h2>Сохранность данных</h2><p class="note">Данные хранятся локально в Safari. Очистка данных сайта или удаление приложения может их уничтожить. Делай резервные копии регулярно. Не загружай файл с финансовыми данными в публичный GitHub.</p><div class="actions"><button id="exportBtn">Скачать копию JSON</button><button class="ghost" id="testBtn">Проверить хранилище</button></div><label>Восстановить из копии<input type="file" id="importFile" accept=".json,application/json"></label><button class="del" id="wipeBtn">Удалить все данные</button></div>`;
}
function nav(k){tab=k;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){nav(n.dataset.nav);return}let a=e.target.closest('[data-action]');if(a?.dataset.action==='task-add'){let title=prompt('Задача на сегодня');if(title?.trim())change(()=>data.tasks.push({id:id(),date:dateToday(),title:title.trim(),done:false}),'Задача добавлена');return}let t=e.target.closest('[data-task-del]');if(t){change(()=>data.tasks=data.tasks.filter(x=>x.id!==t.dataset.taskDel),'Задача удалена');return}let ev=e.target.closest('[data-event-del]');if(ev&&confirm('Удалить платёж или поступление?')){change(()=>data.events=data.events.filter(x=>x.id!==ev.dataset.eventDel),'Удалено');return}let tx=e.target.closest('[data-tx-del]');if(tx&&confirm('Удалить операцию?')){change(()=>data.transactions=data.transactions.filter(x=>x.id!==tx.dataset.txDel),'Операция удалена');return}let g=e.target.closest('[data-goal-del]');if(g&&confirm('Удалить цель?')){change(()=>data.goals=data.goals.filter(x=>x.id!==g.dataset.goalDel),'Цель удалена');return}if(e.target.id==='exportBtn'){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='CONTROL-backup-'+dateToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);return}if(e.target.id==='testBtn'){let key='control_storage_test';try{localStorage.setItem(key,'ok');if(localStorage.getItem(key)!=='ok')throw Error('Не читается');localStorage.removeItem(key);notify('Хранилище работает')}catch(err){notify('Хранилище недоступно: '+err.message,true)}return}if(e.target.id==='wipeBtn'&&confirm('Удалить все данные? Сначала скачай резервную копию.'))change(()=>data=fresh(),'Данные удалены')});
document.addEventListener('change',async e=>{if(e.target.dataset.task){change(()=>{let t=data.tasks.find(x=>x.id===e.target.dataset.task);if(t)t.done=e.target.checked},'Задача обновлена')}if(e.target.id==='importFile'){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.version!==2||!Array.isArray(x.transactions)||!Array.isArray(x.events)||!Array.isArray(x.goals)||!Array.isArray(x.tasks))throw Error('Неверный формат');if(confirm('Заменить все данные содержимым копии?'))change(()=>data={...fresh(),...x},'Копия восстановлена')}catch(err){notify('Ошибка импорта: '+err.message,true)}}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form),v=k=>money(fd.get(k)),title=k=>String(fd.get(k)||'').trim();if(form.id==='baseForm'){let a=v('opening'),b=v('essential'),c=v('protected');if([a,b,c].some(x=>x===null))return notify('Проверь суммы',true);change(()=>{data.opening=a;data.essential=b;data.protected=c;data.configured=true},'Баланс и резерв сохранены');return}if(form.id==='transactionForm'){let a=v('amount');if(!a||!title('name'))return notify('Заполни сумму и описание',true);change(()=>data.transactions.push({id:id(),kind:fd.get('kind'),amount:a,name:title('name'),date:fd.get('date')}),'Операция записана');return}if(form.id==='eventForm'){let a=v('amount'),dt=fd.get('date');if(!a||!title('name'))return notify('Заполни сумму и название',true);change(()=>data.events.push({id:id(),kind:fd.get('kind'),name:title('name'),amount:a,date:dt,day:Number(dt.slice(8)),recurring:fd.get('recurring')==='yes',confirmed:fd.get('confirmed')==='on'}),'Добавлено в прогноз');return}if(form.id==='purchaseForm'){let a=v('amount'),dt=fd.get('date');if(!a||dt<dateToday())return notify('Укажи сумму и будущую дату',true);let r=analyse(a,dt);$('#purchaseResult').innerHTML=`<div class="card" style="margin-top:18px"><h2 class="${r.level}">${r.heading}</h2><p>${safe(r.reason)}</p><div class="entry row"><span>Минимум без покупки</span><b>${fmt(r.before.minimum)}</b></div><div class="entry row"><span>Минимум с покупкой</span><b>${fmt(r.after.minimum)}</b></div><p class="note">Расчёт опирается только на внесённые данные.</p></div>`;return}if(form.id==='independenceForm'){let a=v('months'),b=v('profit');if(a===null||a<1||a>36||b===null)return notify('Проверь параметры',true);change(()=>{data.goalMonths=Math.round(a);data.businessProfit=b},'Цели обновлены');return}if(form.id==='goalForm'){let a=v('target'),b=v('saved');if(!a||b===null||!title('title'))return notify('Заполни цель',true);change(()=>data.goals.push({id:id(),title:title('title'),target:a,saved:b}),'Цель создана');return}if(form.dataset.goalUpdate){let a=v('saved');if(a===null)return notify('Проверь сумму',true);change(()=>{let g=data.goals.find(x=>x.id===form.dataset.goalUpdate);if(g)g.saved=a},'Прогресс обновлён')}});
window.addEventListener('error',e=>notify('Ошибка приложения: '+e.message,true));
// CONTROL 3 — cashflow cockpit, separate actual savings, and income split.
const prevRender=render;
function extraState(){if(typeof data.vault!=='number')data.vault=0;if(!Array.isArray(data.allocations))data.allocations=[];if(!Array.isArray(data.splitHistory))data.splitHistory=[];if(typeof data.savingsPercent!=='number')data.savingsPercent=20}
function upcomingBills(days=30){let start=dateToday(),end=nextDate(start,days),out=[];for(let e of data.events.filter(x=>x.kind==='expense')){if(e.recurring){let d=monthOccurrence(e.day,start);while(d<=end){out.push({...e,date:d});d=monthOccurrence(e.day,nextDate(d,1))}}else if(e.date>=start&&e.date<=end)out.push(e)}return out.sort((a,b)=>a.date.localeCompare(b.date))}
function budgetInfo(){extraState();let bal=current(),bills=upcomingBills(30),billSum=bills.reduce((s,e)=>s+e.amount,0),living=data.essential,locked=data.vault;let futureIncome=0;const from=dateToday(),to=nextDate(from,30);for(const e of data.events.filter(x=>x.kind==='income'&&x.confirmed)){if(e.recurring){let d=monthOccurrence(e.day,from);while(d<=to){futureIncome+=e.amount;d=monthOccurrence(e.day,nextDate(d,1))}}else if(e.date>=from&&e.date<=to)futureIncome+=e.amount}let f=projected(30),floor=Math.max(data.protected,locked),net=f.minimum-floor,deficit=Math.max(0,-net),maxSpend=Math.max(0,net),ratio=bal>0?Math.min(100,Math.max(0,maxSpend/bal*100)):0;let level=net<0?'critical':net<Math.max(3000,living*.1)?'warning':'safe';return {bal,bills,billSum,living,locked,net,deficit,maxSpend,ratio,level,f,futureIncome,floor}}
function barLine(name,amt,base,subtitle,cls=''){return `<div class="budget-line"><div class="row"><b>${safe(name)}</b><b>${fmt(amt)}</b></div><div class="bar ${cls}"><span style="width:${base?Math.min(100,Math.max(0,amt/base*100)):0}%"></span></div><div class="micro">${safe(subtitle)}</div></div>`}
function cockpit(){let b=budgetInfo(),risk=b.level,ringColor=risk==='critical'?'#ff7189':risk==='warning'?'#ffcc75':'#a7f7cb',pct=b.bal>0?Math.min(100,Math.max(0,b.maxSpend/b.bal*100)):0,ringTitle=risk==='critical'?'ХВАТИТ ТРАТИТЬ!':risk==='warning'?'ОСТОРОЖНО':'ЗАПАС ЕСТЬ';let signal=risk==='critical'?`Прогнозный минимум ${fmt(b.f.minimum)} на ${readable(b.f.minDate)}. До защищённого порога ${fmt(b.floor)} не хватает ${fmt(b.deficit)}. Проверь даты поступлений и платежей.`:risk==='warning'?`На ${readable(b.f.minDate)} прогнозируется небольшой запас ${fmt(b.f.minimum)}. Крупные покупки могут создать риск.`:`На ${readable(b.f.minDate)} прогнозный минимум ${fmt(b.f.minimum)}. Защищённый порог ${fmt(b.floor)} сохранён.`;return `<div class="section-title">Финансовый радар · с учётом зарплаты</div><div class="card"><div class="ring-wrap"><div class="dash-ring ${risk==='critical'?'pulse':''}" style="--pct:${pct};--ring:${ringColor}"><div class="inner"><span class="ring-title" style="color:${ringColor}">${ringTitle}</span><div class="ring-value">${fmt(b.maxSpend)}</div><span class="micro">условно свободно</span></div></div><div class="ring-side"><div class="micro">Прогноз по дням · 30 дней</div><div class="kpi ${risk==='critical'?'bad':risk==='warning'?'warn':'good'}">${risk==='critical'?'Критический':risk==='warning'?'Повышенный':'Умеренный'} риск</div><p>Подтверждённые поступления: <b class="good">+${fmt(b.futureIncome)}</b></p><p>Минимум: <b>${fmt(b.f.minimum)}</b> · ${readable(b.f.minDate)}</p></div></div><div class="signal ${risk==='critical'?'critical':risk==='safe'?'ok':''}">${signal}</div><p class="note">Доходы учитываются только с указанной даты и если отмечены как подтверждённые. Если зарплата придёт позже платежа, риск останется красным — это правильно.</p></div><div class="section-title">Куда уйдут деньги · 30 дней</div><div class="card">${barLine('Подтверждённые поступления',b.futureIncome,b.bal+b.futureIncome,`В прогнозе на 30 дней`)}${barLine('Обязательные платежи',b.billSum,b.bal+b.futureIncome,`${b.bills.length} платежей в ближайшие 30 дней`,'orange')}${barLine('Повседневная жизнь',b.living,b.bal+b.futureIncome,'Базовые расходы, распределённые по дням')}${barLine('Реально отложено',b.locked,b.bal+b.futureIncome,'Учтено внутри общего баланса, не отдельный расход')}${barLine('Условно свободно',b.maxSpend,b.bal+b.futureIncome,'С учётом худшего дня прогноза',b.net<0?'red':'')}<button class="ghost full" data-nav="money">Платежи и распределение →</button></div>`}
function moneyExtension(){let b=budgetInfo(),list=b.bills.slice(0,20),income=data.transactions.filter(x=>x.kind==='income').slice(-5).reverse();return `<div class="section-title">Распределение поступлений</div><div class="card"><h2>Разложить деньги по конвертам</h2><p class="note">Введите новое поступление и распределите его. Это план, а не банковский перевод. Если доход уже записан в операциях, не добавляй его повторно.</p><form id="splitForm">${num('amount','Сумма нового поступления, ₽','','required min="0.01"')}<label>Откладывать в накоплениях, %<input type="number" name="percent" min="0" max="100" step="1" value="${data.savingsPercent}" required></label><button type="submit" class="full">Рассчитать распределение</button></form><div id="splitResult"></div></div><div class="card"><h2>Мои реальные накопления</h2><div class="kpi good">${fmt(data.vault)}</div><p class="note">Это сумма, которую ты действительно отложил. Она отдельно от защищённого порога и не должна считаться дважды в общем балансе.</p><form id="vaultForm">${num('vault','Сколько реально отложено сейчас, ₽',data.vault,'required')}<button class="full">Обновить накопления</button></form></div><div class="card"><h2>Календарь обязательств · 30 дней</h2>${list.map(e=>`<div class="entry row"><div><b>${safe(e.name)}</b><div class="caption">${readable(e.date)} · ${e.recurring?'ежемесячно':'разовый'}</div></div><b class="warn">${fmt(e.amount)}</b></div>`).join('')||'<div class="empty">Пока нет платежей. Добавь аренду, связь и другие обязательства ниже.</div>'}<div class="entry row"><b>Итого к оплате</b><b>${fmt(b.billSum)}</b></div></div>`}
function goalExtension(){let b=budgetInfo(),totalGoal=data.goals.reduce((s,g)=>s+Math.max(0,g.target-g.saved),0);return `<div class="card"><h2>Сколько откладывать</h2><p class="muted">Твои цели требуют ещё <b>${fmt(totalGoal)}</b>. Приоритет — сначала обязательства, затем финансовая подушка, потом остальные цели.</p><div class="signal ${b.net<0?'critical':''}">Доступно для новых накоплений по текущему 30-дневному бюджету: <b>${fmt(Math.max(0,b.net))}</b>. Это не обещание дохода.</div></div>`}
function insightsExtension(){let b=budgetInfo();return `<div class="card"><h2>Денежная устойчивость</h2>${barLine('Обязательства / баланс',b.billSum,b.bal,`Платежи на 30 дней`,'orange')}${barLine('Накопления / баланс',b.locked,b.bal,'Реально отложенные деньги')}${barLine('Плановые траты / баланс',b.billSum+b.living,b.bal,'Платежи плюс базовая жизнь','orange')}<p class="note">Суммы основаны только на твоих записях. Не являются банковской выпиской.</p></div>`}
render=function(){extraState();prevRender();$('#today').insertAdjacentHTML('beforeend',cockpit());$('#money').insertAdjacentHTML('afterbegin',moneyExtension());$('#goals').insertAdjacentHTML('beforeend',goalExtension());$('#insights').insertAdjacentHTML('beforeend',insightsExtension())};
document.addEventListener('submit',e=>{let form=e.target;if(form.id==='vaultForm'){e.preventDefault();e.stopImmediatePropagation();let val=money(new FormData(form).get('vault'));if(val===null)return notify('Укажи корректную сумму',true);if(val>current())return notify('Накопления не могут превышать текущий баланс',true);change(()=>data.vault=val,'Накопления обновлены')}else if(form.id==='splitForm'){e.preventDefault();e.stopImmediatePropagation();let fd=new FormData(form),amt=money(fd.get('amount')),pct=Number(fd.get('percent'));if(!amt||!Number.isFinite(pct)||pct<0||pct>100)return notify('Проверь сумму и процент',true);data.savingsPercent=pct;persist();let b=budgetInfo(),save=Math.round(amt*pct)/100,remaining=amt-save,need=Math.max(0,b.billSum+b.living-(b.bal-b.locked)),obligations=Math.min(remaining,need),free=Math.max(0,remaining-obligations);$('#splitResult').innerHTML=`<div class="entry">${barLine('Отложить в накопления',save,amt,'Рекомендуемая доля по твоей настройке')}${barLine('На обязательства и жизнь',obligations,amt,'Закрыть выявленный дефицит плановых расходов','orange')}${barLine('Остаток после распределения',free,amt,'Необязательно тратить — можно направить в цели')}</div><p class="note">Рекомендация, не автоматическое перемещение денег. Сумма поступления не добавлена в баланс. Для этого используй «Новая операция».</p>`;notify('Распределение рассчитано')}} ,true);

load();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
